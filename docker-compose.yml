services:
  backend:
    build: .
    image: graphfusion-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DFG_WORKSPACE: /app/workspace
      DFG_CORS_ORIGINS: http://localhost:3000
    volumes:
      - workspace:/app/workspace
      # demo data downloaded on the host (python scripts/download_demo_data.py) is visible to the "NYC demo" button
      - ./data/processed:/app/data/processed:ro
      - ./data/raw:/app/data/raw:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: graphfusion-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  workspace:
